<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: bgShift 15s ease infinite;
        }
        
        @keyframes bgShift {
            0%, 100% {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            50% {
                background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            }
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            animation: containerFadeIn 0.6s ease-out;
        }
        
        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
            animation: titleBounce 0.8s ease-out;
        }
        
        @keyframes titleBounce {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            animation: slideInUp 0.6s ease-out 0.2s both;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
            transform: scale(1.02);
        }
        
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        ul {
            list-style: none;
        }
        
        li {
            padding: 15px;
            background: #f5f5f5;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }
        
        li:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        li.completed {
            background: #e8f5e9;
            border-left-color: #4caf50;
            animation: completeTask 0.5s ease;
        }
        
        @keyframes completeTask {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }
        
        li.completed span {
            text-decoration: line-through;
            color: #999;
            animation: checkmark 0.4s ease;
        }
        
        @keyframes checkmark {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        
        li.deleting {
            animation: slideOutRight 0.4s ease forwards;
        }
        
        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }
        
        .task-text {
            flex: 1;
            transition: all 0.3s ease;
        }
        
        .task-buttons {
            display: flex;
            gap: 8px;
        }
        
        .check-btn, .delete-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            transform: scale(1);
        }
        
        .check-btn {
            background: #4caf50;
            color: white;
        }
        
        .check-btn:hover {
            background: #45a049;
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        
        .check-btn:active {
            animation: buttonClick 0.3s ease;
        }
        
        .delete-btn {
            background: #f44336;
            color: white;
        }
        
        .delete-btn:hover {
            background: #da190b;
            transform: scale(1.1) rotate(-15deg);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }
        
        .delete-btn:active {
            animation: buttonClick 0.3s ease;
        }
        
        @keyframes buttonClick {
            0%, 100% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(0.95);
            }
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 My To-Do List</h1>
        
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button onclick="addTask()">Add</button>
        </div>
        
        <ul id="taskList">
            <div class="empty-state">No tasks yet. Add one to get started!</div>
        </ul>
    </div>
    
    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');
            
            if (input.value.trim() === '') return;
            
            // Remove empty state message
            if (taskList.querySelector('.empty-state')) {
                taskList.innerHTML = '';
            }
            
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="task-text">${escapeHtml(input.value)}</span>
                <div class="task-buttons">
                    <button class="check-btn" onclick="toggleTask(this)">✓</button>
                    <button class="delete-btn" onclick="deleteTask(this)">✕</button>
                </div>
            `;
            
            taskList.appendChild(li);
            input.value = '';
            input.focus();
            saveTasks();
        }
        
        function toggleTask(btn) {
            btn.parentElement.parentElement.classList.toggle('completed');
            saveTasks();
        }
        
        function deleteTask(btn) {
            const li = btn.parentElement.parentElement;
            li.classList.add('deleting');
            setTimeout(() => {
                li.remove();
                if (document.getElementById('taskList').children.length === 0) {
                    document.getElementById('taskList').innerHTML = '<div class="empty-state">No tasks yet. Add one to get started!</div>';
                }
                saveTasks();
            }, 400);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function saveTasks() {
            const tasks = [];
            document.getElementById('taskList').querySelectorAll('li').forEach(li => {
                const text = li.querySelector('.task-text').textContent;
                const completed = li.classList.contains('completed');
                tasks.push({ text, completed });
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }
        
        function loadTasks() {
            const saved = localStorage.getItem('tasks');
            if (saved) {
                const tasks = JSON.parse(saved);
                document.getElementById('taskList').innerHTML = '';
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    if (task.completed) li.classList.add('completed');
                    li.innerHTML = `
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <div class="task-buttons">
                            <button class="check-btn" onclick="toggleTask(this)">✓</button>
                            <button class="delete-btn" onclick="deleteTask(this)">✕</button>
                        </div>
                    `;
                    document.getElementById('taskList').appendChild(li);
                });
            }
        }
        
        // Allow Enter key to add tasks
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });
        
        // Load tasks on page load
        window.addEventListener('DOMContentLoaded', loadTasks);
    </script>
</body>
</html>
